[pytest]
pythonpath = .
# pytest-asyncio 0.23.3 несовместим с pytest 9.1.1: при сборе всего корня
# (python -m pytest -q) плагин падает с INTERNALERROR ('Package' object has no
# attribute 'obj'). Асинхронных тестов в ядре нет, поэтому плагин отключаем.
addopts = -p no:asyncio
filterwarnings =
    ignore:builtin type \w+ has no __module__ attribute:DeprecationWarning
