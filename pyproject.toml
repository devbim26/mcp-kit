[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-kit"
version = "0.1.0"
description = "Переиспользуемый каркас MCP-серверов: auth, health, ошибки, аудит, надзор"
requires-python = ">=3.11"
dependencies = ["mcp>=1.21,<2", "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7"]

[project.scripts]
mcp-kit = "mcp_kit.cli:main"

[tool.setuptools.packages.find]
include = ["mcp_kit*"]
